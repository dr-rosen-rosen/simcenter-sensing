# Session profile: sim-center lab, full instrument set.
# Stream inventory from the validated October 2026 recordings. Tune
# `required` per session type (e.g. set the Tobii block false for
# sessions without eye tracking).
#
# Exactly-once matters: every `name` entry expects exactly 1 stream, which
# catches the stale-duplicate-G3LSLConnector failure mode before recording.

[labrecorder]
host = "127.0.0.1"
port = 22345

[session]
study = "SIMLAB"          # update per study (identifiers.md UPPERCASE-SLUG)
out_dir = "~/sessions"

[preflight]
resolve_seconds = 3.0
flow_seconds = 3.0

# --- EmotiBit: 15 continuous streams ---------------------------------------

[[streams]]
name = "PPG_IR"
type = "PPGInfrared"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "PPG_RED"
type = "PPGRed"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "PPG_GRN"
type = "PPGGreen"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "EDA"
type = "EDA"
nominal_hz = 15
required = true
check_flow = true

[[streams]]
name = "TEMP1"
type = "Temperature"
nominal_hz = 7.5
required = true
check_flow = true

[[streams]]
name = "THERM"
type = "Thermopile"
nominal_hz = 7.5
required = true
check_flow = true

[[streams]]
name = "ACC_X"
type = "AccelerometerX"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "ACC_Y"
type = "AccelerometerY"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "ACC_Z"
type = "AccelerometerZ"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "GYRO_X"
type = "GyroscopeX"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "GYRO_Y"
type = "GyroscopeY"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "GYRO_Z"
type = "GyroscopeZ"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "MAG_X"
type = "MagnetometerX"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "MAG_Y"
type = "MagnetometerY"
nominal_hz = 25
required = true
check_flow = true

[[streams]]
name = "MAG_Z"
type = "MagnetometerZ"
nominal_hz = 25
required = true
check_flow = true

# --- EmotiBit derived (wearer-dependent; presence only) ---------------------

[[streams]]
name = "HR"
type = "HeartRate"
required = false
check_flow = false

[[streams]]
name = "SCR_AMP"
type = "SCRAmplitude"
required = false
check_flow = false

[[streams]]
name = "SCR_RIS"
type = "SCRRiseTime"
required = false
check_flow = false

[[streams]]
name = "SCR_FREQ"
type = "SCRFrequency"
required = false
check_flow = false

# --- Tobii Glasses 3 via G3LSLConnector (one instance!) ---------------------
# 50 Hz gaze family. If a count shows 2, a stale connector is running.

[[streams]]
name = "Gaze2d"
type = "Gaze2d"
nominal_hz = 50
required = true
check_flow = true

[[streams]]
name = "Gaze3d"
type = "Gaze3d"
nominal_hz = 50
required = true
check_flow = true

[[streams]]
name = "GazeDirection"
type = "GazeDirection"
nominal_hz = 50
required = true
check_flow = true

[[streams]]
name = "GazeOrigin"
type = "GazeOrigin"
nominal_hz = 50
required = true
check_flow = true

[[streams]]
name = "Pupil"
type = "Pupil"
nominal_hz = 50
required = true
check_flow = true

# SyncInOut declares 10 Hz but fires on change (~0.2 Hz): never flow-check.
[[streams]]
name = "SyncInOut"
type = "SyncInOut"
required = false
check_flow = false

# --- Bridges ---------------------------------------------------------------

[[streams]]
name = "simcenter.mic.marker"
type = "Markers"
required = true
check_flow = true

[[streams]]
prefix = "simcenter.zed."
type = "Markers"
min_count = 1
max_count = 2
required = true
check_flow = true
